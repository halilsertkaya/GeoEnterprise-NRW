<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoEnterprise-NRW - OpenLayers Enterprise GIS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100vh; }
        .enterprise-sidebar {
            position: absolute;
            top: 70px;
            left: 20px;
            width: 340px;
            z-index: 1000;
            background: rgba(33, 37, 41, 0.92);
            backdrop-filter: blur(8px);
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 200px;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- Enterprise Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3 position-relative" style="z-index: 1001; height: 56px;">
        <a class="navbar-brand" href="#"><i class="fa-solid fa-building-shield text-warning"></i> GeoEnterprise-NRW <span class="badge bg-secondary small">OpenLayers Core</span></a>
        <span class="text-white-50 small"><i class="fa-solid fa-server"></i> OGC WMS/WFS Compliant</span>
    </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Layer & Control Sidebar -->
    <div class="enterprise-sidebar p-3">
        <h6 class="fw-bold text-warning mb-3"><i class="fa-solid fa-layer-group"></i> Enterprise Layer Control</h6>
        
        <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="baseLayerToggle" checked onchange="toggleBaseLayer(this)">
            <label class="form-check-label small" for="baseLayerToggle">OpenStreetMap Base</label>
        </div>
        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="cologneZoneToggle" checked onchange="toggleCologneLayer(this)">
            <label class="form-check-label small" for="cologneZoneToggle">Cologne Infrastructure & Hazard Vector</label>
        </div>

        <hr class="border-secondary">

        <h6 class="fw-bold text-info mb-2"><i class="fa-solid fa-info-circle"></i> Feature Inspector</h6>
        <div id="featureInfo" class="small text-light bg-dark p-2 rounded border border-secondary" style="min-height: 80px;">
            Click on any infrastructure feature on the map to inspect enterprise attributes.
        </div>
    </div>

    <!-- Popup Overlay -->
    <div id="popup" class="ol-popup">
        <div id="popup-content"></div>
    </div>

    <!-- OpenLayers JS -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // OpenLayers Map Initialization (Centered on Cologne, Germany)
        const cologneCoords = ol.proj.fromLonLat([6.9603, 50.9375]);

        const osmLayer = new ol.layer.Tile({
            source: new ol.source.OSM()
        });

        // Sample Enterprise Vector Layer (Cologne Infrastructure / Hazard Zones)
        const cologneVectorSource = new ol.source.Vector({
            features: [
                new ol.Feature({
                    geometry: new ol.geom.Point(ol.proj.fromLonLat([6.9603, 50.9375])),
                    title: "Cologne Central Station Hub",
                    category: "Critical Infrastructure",
                    status: "Operational / Monitored"
                }),
                new ol.Feature({
                    geometry: new ol.geom.Point(ol.proj.fromLonLat([6.9850, 50.9413])),
                    title: "Deutz Industrial Zone",
                    category: "Flood Risk Area",
                    status: "High Alert"
                }),
                new ol.Feature({
                    geometry: new ol.geom.Point(ol.proj.fromLonLat([6.9320, 50.9200])),
                    title: "Zollstock Substation",
                    category: "Energy Grid",
                    status: "Stable"
                })
            ]
        });

        const vectorLayer = new ol.layer.Vector({
            source: cologneVectorSource,
            style: new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 9,
                    fill: new ol.style.Fill({ color: '#ffc107' }),
                    stroke: new ol.style.Stroke({ color: '#000', width: 2 })
                })
            })
        });

        const map = new ol.Map({
            target: 'map',
            layers: [osmLayer, vectorLayer],
            view: new ol.View({
                center: cologneCoords,
                zoom: 13
            })
        });

        // Layer Toggle Functions
        function toggleBaseLayer(checkbox) {
            osmLayer.setVisible(checkbox.checked);
        }

        function toggleCologneLayer(checkbox) {
            vectorLayer.setVisible(checkbox.checked);
        }

        // Feature Click Interaction
        map.on('click', function(evt) {
            let feature = map.forEachFeatureAtPixel(evt.pixel, function(feat) {
                return feat;
            });

            if (feature) {
                let props = feature.getProperties();
                let infoHTML = `
                    <strong>${props.title}</strong><br>
                    <span class="text-warning">Category:</span> ${props.category}<br>
                    <span class="text-success">Status:</span> ${props.status}
                `;
                document.getElementById('featureInfo').innerHTML = infoHTML;
            } else {
                document.getElementById('featureInfo').innerHTML = "No feature selected.";
            }
        });
    </script>
</body>
</html>
